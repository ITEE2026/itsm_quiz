    function App() {
      const [questions, setQuestions] = useState(() => {
        const saved = localStorage.getItem('itsm_master_questions');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.length > 0) return parsed;
        }
        return EMBEDDED_QUESTIONS;
      });

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('itsm_master_history');
        return saved ? JSON.parse(saved) : {};
      });

      const [bookmarks, setBookmarks] = useState(() => {
        const saved = localStorage.getItem('itsm_master_bookmarks');
        return saved ? JSON.parse(saved) : [];
      });

      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('itsm_master_notes');
        return saved ? JSON.parse(saved) : {};
      });

      const [currentTab, setCurrentTab] = useState(questions.length > 0 ? 'dashboard' : 'manage');
      const [currentQuestions, setCurrentQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [selectedYear, setSelectedYear] = useState('all');
      const [selectedCategory, setSelectedCategory] = useState('サービスマネジメント');
      const [jsonInput, setJsonInput] = useState('');
      const [jsonMessage, setJsonMessage] = useState('');
      const [exportedJson, setExportedJson] = useState('');
      const [copySuccess, setCopySuccess] = useState('');

      useEffect(() => {
        localStorage.setItem('itsm_master_questions', JSON.stringify(questions));
      }, [questions]);

      useEffect(() => {
        localStorage.setItem('itsm_master_history', JSON.stringify(history));
      }, [history]);

      useEffect(() => {
        localStorage.setItem('itsm_master_bookmarks', JSON.stringify(bookmarks));
      }, [bookmarks]);

      useEffect(() => {
        localStorage.setItem('itsm_master_notes', JSON.stringify(notes));
      }, [notes]);

      // 年度ドロップダウンを降順（最新順）にソート
      const availableYears = useMemo(() => {
        const years = Array.from(new Set(questions.map(q => q.year)));
        return years.sort((a, b) => {
          const parseYear = (str) => {
            if (str.includes('令和')) {
              const num = parseInt(str.replace(/[^0-9]/g, ''), 10);
              return 2018 + num;
            } else if (str.includes('平成')) {
              const num = parseInt(str.replace(/[^0-9]/g, ''), 10);
              return 1988 + num;
            }
            return 0;
          };
          return parseYear(b) - parseYear(a);
        });
      }, [questions]);

      const stats = useMemo(() => {
        const totalQuestionsCount = questions.length;
        const answeredIds = Object.keys(history);
        const answeredCount = answeredIds.length;
        const correctCount = Object.values(history).filter(h => h.isCorrect).length;
        const overallRate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

        const categories = ["サービスマネジメント", "情報セキュリティ", "ストラテジ・法務"];
        const catStats = categories.map(cat => {
          const catQs = questions.filter(q => q.category === cat);
          const catTotal = catQs.length;
          const catAns = catQs.filter(q => history[q.id]);
          const catCorr = catAns.filter(q => history[q.id]?.isCorrect);
          return {
            category: cat,
            total: catTotal,
            answered: catAns.length,
            correct: catCorr.length,
            rate: catAns.length > 0 ? Math.round((catCorr.length / catAns.length) * 100) : 0
          };
        });

        return { totalQuestionsCount, answeredCount, correctCount, overallRate, catStats };
      }, [questions, history]);

      const startStudy = (mode) => {
        let pool = [...questions];

        if (pool.length === 0) {
          alert('問題が登録されていません。「データ管理」タブから問題JSONをインポートしてください。');
          return;
        }

        if (mode === 'year') {
          if (selectedYear !== 'all') {
            pool = pool.filter(q => q.year === selectedYear);
          }
        } else if (mode === 'category') {
          pool = pool.filter(q => q.category === selectedCategory);
        } else if (mode === 'review') {
          pool = pool.filter(q => bookmarks.includes(q.id) || (history[q.id] && !history[q.id].isCorrect));
        } else if (mode === 'random') {
          pool = pool.sort(() => Math.random() - 0.5).slice(0, 25);
        }

        if (pool.length === 0) {
          alert('条件に一致する問題がありません。');
          return;
        }

        setCurrentQuestions(pool);
        setCurrentIndex(0);
        setSelectedOption(null);
        setIsAnswered(false);
        setCurrentTab('study');
      };

      const handleAnswerSelect = (optionIndex) => {
        if (isAnswered) return;
        setSelectedOption(optionIndex);
        setIsAnswered(true);

        const currentQ = currentQuestions[currentIndex];
        const isCorrect = optionIndex === currentQ.answer;

        setHistory(prev => ({
          ...prev,
          [currentQ.id]: {
            isCorrect,
            selectedOption: optionIndex,
            timestamp: new Date().toISOString()
          }
        }));
      };

      const handleNextQuestion = () => {
        if (currentIndex < currentQuestions.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswered(false);
        } else {
          alert('演習問題がすべて完了しました！お疲れ様でした。');
          setCurrentTab('dashboard');
        }
      };

      const toggleBookmark = (qId) => {
        setBookmarks(prev => 
          prev.includes(qId) ? prev.filter(id => id !== qId) : [...prev, qId]
        );
      };

      const handleNoteChange = (qId, text) => {
        setNotes(prev => ({ ...prev, [qId]: text }));
      };

      const handleImportJSON = () => {
        try {
          const parsed = JSON.parse(jsonInput);
          if (!Array.isArray(parsed)) throw new Error('配列データ（[ ... ]）の形式である必要があります。');
          
          setQuestions(prev => {
            const existingMap = new Map(prev.map(q => [q.id, q]));
            parsed.forEach(newQ => existingMap.set(newQ.id, newQ));
            return Array.from(existingMap.values());
          });

          setJsonMessage(`SUCCESS: ${parsed.length}問のデータを取り込みました！ (現在の総問題数: ${questions.length + parsed.length}問)`);
          setJsonInput('');
        } catch (err) {
          setJsonMessage(`ERROR: JSONの読み込みに失敗しました (${err.message})`);
        }
      };

      const handleExportJSON = () => {
        const jsonStr = JSON.stringify(questions, null, 2);
        setExportedJson(jsonStr);
        setCopySuccess('');
      };

      const handleCopyExportedJSON = () => {
        navigator.clipboard.writeText(exportedJson);
        setCopySuccess('クリップボードにコピーしました！');
      };

      const handleResetData = () => {
        if (confirm('全ての学習履歴、ブックマーク、登録データを消去して初期状態に戻しますか？')) {
          localStorage.clear();
          setQuestions(EMBEDDED_QUESTIONS);
          setHistory({});
          setBookmarks([]);
          setNotes({});
          setExportedJson('');
          setJsonMessage('');
          alert('データを初期化しました。');
        }
      };

      const currentQ = currentQuestions[currentIndex];

      return (
        <div className="min-h-screen flex flex-col max-w-5xl mx-auto px-4 py-6">
          <header className="flex flex-col md:flex-row justify-between items-center pb-6 mb-6 border-b border-slate-800 gap-4">
            <div className="flex items-center gap-3">
              <div className="bg-indigo-600 p-3 rounded-xl text-white">
                <i className="fa-solid fa-graduation-cap text-2xl"></i>
              </div>
              <div>
                <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">
                  ITサービスマネージャ 午前II 過去問道場
                </h1>
                <p className="text-xs text-slate-400">高度情報処理技術者試験 午前II 過去10年全250問演習</p>
              </div>
            </div>

            <nav className="flex bg-slate-800 p-1.5 rounded-xl border border-slate-700 text-sm">
              <button 
                onClick={() => setCurrentTab('dashboard')} 
                className={`px-4 py-2 rounded-lg font-medium transition ${currentTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-chart-pie mr-2"></i>ダッシュボード
              </button>
              <button 
                onClick={() => setCurrentTab('select')} 
                className={`px-4 py-2 rounded-lg font-medium transition ${currentTab === 'select' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-list mr-2"></i>問題選択
              </button>
              <button 
                onClick={() => setCurrentTab('manage')} 
                className={`px-4 py-2 rounded-lg font-medium transition ${currentTab === 'manage' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-database mr-2"></i>データ管理
              </button>
            </nav>
          </header>

          <main className="flex-1">
            {currentTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 font-medium">登録済み総問題数</p>
                    <p className="text-3xl font-bold mt-2 text-indigo-400">{stats.totalQuestionsCount} <span className="text-sm font-normal text-slate-400">問</span></p>
                  </div>
                  <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 font-medium">着手済み問題数</p>
                    <p className="text-3xl font-bold mt-2 text-cyan-400">{stats.answeredCount} <span className="text-sm font-normal text-slate-400">問</span></p>
                  </div>
                  <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 font-medium">総合正解率</p>
                    <p className="text-3xl font-bold mt-2 text-emerald-400">{stats.overallRate} <span className="text-sm font-normal text-slate-400">%</span></p>
                  </div>
                  <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 font-medium">要復習 (ブックマーク/誤答)</p>
                    <p className="text-3xl font-bold mt-2 text-amber-400">{bookmarks.length} <span className="text-sm font-normal text-slate-400">問</span></p>
                  </div>
                </div>

                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-solid fa-layer-group text-indigo-400"></i>分野別習熟度
                  </h2>
                  <div className="space-y-4">
                    {stats.catStats.map((cat, idx) => (
                      <div key={idx} className="space-y-1.5">
                        <div className="flex justify-between text-sm">
                          <span className="font-medium text-slate-200">{cat.category}</span>
                          <span className="text-slate-400">{cat.correct} / {cat.answered} 問正解 ({cat.rate}%)</span>
                        </div>
                        <div className="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
                          <div className="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full transition-all duration-500" style={{ width: `${cat.rate}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex flex-wrap gap-4">
                  <button onClick={() => startStudy('random')} className="flex-1 min-w-[200px] bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white p-5 rounded-2xl font-bold text-lg shadow-lg flex items-center justify-center gap-3 transition">
                    <i className="fa-solid fa-dice text-2xl"></i>全登録問題からランダム演習
                  </button>
                  <button onClick={() => startStudy('review')} className="flex-1 min-w-[200px] bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white p-5 rounded-2xl font-bold text-lg shadow-lg flex items-center justify-center gap-3 transition">
                    <i className="fa-solid fa-rotate-left text-2xl"></i>要復習・弱点問題を特訓
                  </button>
                </div>
              </div>
            )}

            {currentTab === 'select' && (
              <div className="space-y-6">
                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-solid fa-calendar text-indigo-400"></i>年度を選んで演習（降順）
                  </h2>
                  <div className="flex gap-3">
                    <select 
                      value={selectedYear} 
                      onChange={(e) => setSelectedYear(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                      <option value="all">全年度（登録済み全問題）</option>
                      {availableYears.map(yr => (
                        <option key={yr} value={yr}>{yr}</option>
                      ))}
                    </select>
                    <button 
                      onClick={() => startStudy('year')}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold transition">
                      スタート
                    </button>
                  </div>
                </div>

                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-solid fa-tags text-indigo-400"></i>分野を選んで演習
                  </h2>
                  <div className="flex gap-3">
                    <select 
                      value={selectedCategory} 
                      onChange={(e) => setSelectedCategory(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                      <option value="サービスマネジメント">サービスマネジメント（ITIL・JIS Q 20000等）</option>
                      <option value="情報セキュリティ">情報セキュリティ</option>
                      <option value="ストラテジ・法務">ストラテジ・法務・プロジェクトマネジメント</option>
                    </select>
                    <button 
                      onClick={() => startStudy('category')}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold transition">
                      スタート
                    </button>
                  </div>
                </div>
              </div>
            )}

            {currentTab === 'study' && currentQ && (
              <div className="space-y-6">
                <div className="flex justify-between items-center text-sm text-slate-400">
                  <span className="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-indigo-400 font-medium">
                    {currentQ.year} 問{currentQ.number} ({currentQ.category})
                  </span>
                  <div className="flex items-center gap-4">
                    <span>{currentIndex + 1} / {currentQuestions.length} 問</span>
                    <button 
                      onClick={() => toggleBookmark(currentQ.id)} 
                      className={`text-xl transition ${bookmarks.includes(currentQ.id) ? 'text-amber-400' : 'text-slate-600 hover:text-slate-400'}`}>
                      <i className="fa-solid fa-bookmark"></i>
                    </button>
                  </div>
                </div>

                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-medium leading-relaxed whitespace-pre-wrap text-slate-100">
                    {currentQ.question}
                  </h2>
                </div>

                <div className="space-y-3">
                  {currentQ.options.map((opt, idx) => {
                    const prefix = ['ア', 'イ', 'ウ', 'エ'][idx];
                    let btnStyle = "bg-slate-800 border-slate-700 hover:bg-slate-750 text-slate-200";

                    if (isAnswered) {
                      if (idx === currentQ.answer) {
                        btnStyle = "bg-emerald-950/60 border-emerald-500 text-emerald-200 font-bold";
                      } else if (idx === selectedOption) {
                        btnStyle = "bg-rose-950/60 border-rose-500 text-rose-200";
                      } else {
                        btnStyle = "bg-slate-800/40 border-slate-800 text-slate-500";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        disabled={isAnswered}
                        onClick={() => handleAnswerSelect(idx)}
                        className={`w-full text-left p-4 rounded-xl border flex items-start gap-3 transition ${btnStyle}`}>
                        <span className="bg-slate-900 px-2.5 py-1 rounded-md text-xs font-bold border border-slate-700 mt-0.5">
                          {prefix}
                        </span>
                        <span className="flex-1 leading-relaxed">{opt}</span>
                      </button>
                    );
                  })}
                </div>

                {isAnswered && (
                  <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                    <div className="flex items-center gap-3">
                      {selectedOption === currentQ.answer ? (
                        <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-lg text-sm font-bold flex items-center gap-1.5">
                          <i className="fa-solid fa-circle-check"></i> 正解！
                        </span>
                      ) : (
                        <span className="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-lg text-sm font-bold flex items-center gap-1.5">
                          <i className="fa-solid fa-circle-xmark"></i> 不正解
                        </span>
                      )}
                      <span className="text-sm text-slate-400">
                        正解は <strong className="text-indigo-400">{['ア', 'イ', 'ウ', 'エ'][currentQ.answer]}</strong> です。
                      </span>
                    </div>

                    <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap border-t border-slate-700/60 pt-4">
                      {currentQ.explanation}
                    </p>

                    <div className="flex flex-wrap gap-2 pt-2">
                      {currentQ.keywords?.map((kw, i) => (
                        <span key={i} className="bg-slate-900 border border-slate-700 text-slate-400 text-xs px-2.5 py-1 rounded-md">
                          #{kw}
                        </span>
                      ))}
                    </div>

                    <div className="pt-2">
                      <textarea
                        placeholder="この問題に関する自分用メモを入力..."
                        value={notes[currentQ.id] || ''}
                        onChange={(e) => handleNoteChange(currentQ.id, e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                        rows="2">
                      </textarea>
                    </div>

                    <button
                      onClick={handleNextQuestion}
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
                      次の問題へ <i className="fa-solid fa-arrow-right"></i>
                    </button>
                  </div>
                )}
              </div>
            )}

            {currentTab === 'manage' && (
              <div className="space-y-6">
                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-solid fa-file-import text-indigo-400"></i>問題JSONのインポート (追加・復元)
                  </h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    書き出したJSONデータ（250問分）を下のテキストエリアに貼り付け、「JSONから追加・更新」を押してください。
                  </p>
                  <textarea
                    rows="8"
                    value={jsonInput}
                    onChange={(e) => setJsonInput(e.target.value)}
                    placeholder="ここにJSON形式の配列データ（[ ... ]）を貼り付けてください..."
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 font-mono text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
                  </textarea>
                  
                  {jsonMessage && (
                    <div className={`p-3 rounded-lg text-xs font-mono ${jsonMessage.startsWith('SUCCESS') ? 'bg-emerald-950/60 border border-emerald-500/50 text-emerald-300' : 'bg-rose-950/60 border border-rose-500/50 text-rose-300'}`}>
                      {jsonMessage}
                    </div>
                  )}

                  <button 
                    onClick={handleImportJSON}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold text-sm transition">
                    JSONから追加・更新
                  </button>
                </div>

                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-solid fa-file-export text-cyan-400"></i>現在の全登録データをJSON出力 (バックアップ用)
                  </h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    現在アプリ内に蓄積されているすべての過去問データ（{questions.length}問）を1つのJSONテキストとして出力できます。
                  </p>
                  
                  <button 
                    onClick={handleExportJSON}
                    className="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-xl font-bold text-sm transition flex items-center gap-2">
                    <i className="fa-solid fa-code"></i> 現在の全問題データをJSON形式で書き出す
                  </button>

                  {exportedJson && (
                    <div className="space-y-3 pt-2">
                      <div className="flex justify-between items-center">
                        <span className="text-xs text-slate-400 font-mono">全 {questions.length} 問のデータ</span>
                        <button 
                          onClick={handleCopyExportedJSON}
                          className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                          <i className="fa-solid fa-copy"></i> クリップボードにコピー
                        </button>
                      </div>

                      {copySuccess && (
                        <p className="text-xs text-emerald-400 font-medium">{copySuccess}</p>
                      )}

                      <textarea
                        rows="8"
                        readOnly
                        value={exportedJson}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 font-mono text-xs text-slate-300 focus:outline-none">
                      </textarea>
                    </div>
                  )}
                </div>

                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-bold text-rose-400 flex items-center gap-2">
                    <i className="fa-solid fa-triangle-exclamation"></i>データ初期化
                  </h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    学習履歴やインポートした問題をすべてクリアし、最初の状態に戻します。
                  </p>
                  <button 
                    onClick={handleResetData}
                    className="bg-rose-600/20 border border-rose-500/50 hover:bg-rose-600/40 text-rose-300 px-6 py-3 rounded-xl font-bold text-sm transition">
                    データを初期化・全削除
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
